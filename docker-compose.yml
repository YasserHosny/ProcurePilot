services:
  # ---------------------------------------------------------------------------
  # Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: procurepilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      # Local development uses hosted Supabase/Postgres from .env. Redis remains local because it
      # is only the RQ broker for background work, not the system of record.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (RQ broker for quotation extraction jobs)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: procurepilot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Quotation Extraction Worker (RQ)
  # ---------------------------------------------------------------------------
  extraction-worker:
    build:
      context: .
      dockerfile: infra/docker/extraction-worker.Dockerfile
    container_name: procurepilot-extraction-worker
    # Match the host user so the read-only ~/.aws mount below (owned 0600 by the host user,
    # per the AWS CLI's own permissions) stays readable — the image's own "appuser" (uid 1001)
    # can't read another uid's files. Local dev only; production doesn't use docker-compose.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # SSO/credential cache only — same AWS profile the container resolves via AWS_PROFILE.
      # Refresh it on the host with `aws sso login --profile <name>` when it expires.
      - ${HOME}/.aws:/home/appuser/.aws:ro
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      EXTRACTION_QUEUE_NAME: ${EXTRACTION_QUEUE_NAME:-quotation-extraction}
      EXTRACTION_PROVIDER_MODE: ${EXTRACTION_PROVIDER_MODE:-bedrock}
      EXTRACTION_CONFIDENCE_THRESHOLD: ${EXTRACTION_CONFIDENCE_THRESHOLD:-0.85}
      # Running as the host uid (above) means there's no /etc/passwd entry, so boto3's
      # `~/.aws` expansion needs HOME set explicitly rather than looked up from uid.
      HOME: /home/appuser
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Basket Split Optimiser Worker (RQ)
  # ---------------------------------------------------------------------------
  optimiser:
    image: python:3.12-slim
    container_name: procurepilot-optimiser
    working_dir: /workspace/services/optimiser
    volumes:
      - .:/workspace
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      BASKET_SPLIT_QUEUE_NAME: ${BASKET_SPLIT_QUEUE_NAME:-basket-split}
      PYTHONPATH: /workspace/services/optimiser/src
    depends_on:
      redis:
        condition: service_started
    command: >
      sh -c "pip install -e /workspace/services/optimiser
      && python -m procurepilot_optimiser_worker"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Savings Export Worker (apps/api-owned RQ entrypoint)
  # ---------------------------------------------------------------------------
  export-worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: procurepilot-export-worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      EXPORT_QUEUE_NAME: ${EXPORT_QUEUE_NAME:-exports}
      SUPABASE_EXPORTS_BUCKET: ${SUPABASE_EXPORTS_BUCKET:-exports}
    depends_on:
      redis:
        condition: service_started
    command: python -m procurepilot_api.workers.export_worker
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend Web SPA (Angular behind Nginx)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: procurepilot-web
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped
