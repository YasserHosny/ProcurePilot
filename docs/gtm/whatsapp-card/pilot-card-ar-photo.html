<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>ProcurePilot pilot card (photo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B2545}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;font-family:'Readex Pro',sans-serif;
  background:#0B2545 url(hf-kitchen-bg.png) center 62%/cover no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,37,69,.97) 0%,rgba(11,37,69,.9) 38%,rgba(11,37,69,.15) 62%,rgba(11,37,69,0) 72%,rgba(11,37,69,.85) 90%,#0B2545 100%)}
.content{position:relative;height:100%;padding:72px 80px 64px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:76px}
.tag{font-size:26px;font-weight:500;color:#0B2545;background:#19B8A4;border-radius:999px;padding:10px 28px}
.kicker{margin-top:56px;font-size:34px;font-weight:500;color:#C9D6E3}
h1{margin:14px 0 0;font-size:74px;line-height:1.25;font-weight:700;letter-spacing:-.5px}
h1 em{font-style:normal;color:#19B8A4}
.sub{margin-top:22px;font-size:35px;line-height:1.55;color:#D7E3F0}
.sub b{color:#fff;font-weight:600}
.cta{margin-top:auto;background:#19B8A4;color:#0B2545;border-radius:32px;padding:32px 44px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cta .t1{font-size:46px;font-weight:700}
.cta .t2{font-size:30px;font-weight:500;margin-top:6px}
.cta .arrow{font-size:76px;font-weight:700;line-height:1}
</style></head><body>
<div class="card">
  <div class="shade"></div>
  <div class="content">
    <div class="top">
      <img src="../../brand/logo/procurepilot-arabic-horizontal-dark.svg" alt="بروكيور بايلوت">
      <div class="tag">بايلوت مجاني</div>
    </div>
    <div class="kicker">للمطاعم والشركات اللي عندها فروع</div>
    <h1>اعرف مين <em>أوفر مورد</em><br>قبل ما تدفع.</h1>
    <div class="sub">ابعت عروض الموردين — PDF أو صورة — وبروكيور بايلوت<br>يقراها، يقارنها جنب بعض، و<b>يوريك قد إيه وفّرت بالجنيه</b>.</div>
    <div class="cta">
      <div><div class="t1">جرّبه مجاناً ١٤ يوم</div><div class="t2">أماكن البايلوت محدودة — ابعتلي رسالة هنا</div></div>
      <div class="arrow">←</div>
    </div>
  </div>
</div>
</body></html>
