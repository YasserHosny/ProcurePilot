<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Readex Pro';src:url(fonts/rp1.ttf);font-weight:300}
@font-face{font-family:'Readex Pro';src:url(fonts/rp2.ttf);font-weight:400}
@font-face{font-family:'Readex Pro';src:url(fonts/rp3.ttf);font-weight:500}
@font-face{font-family:'Readex Pro';src:url(fonts/rp4.ttf);font-weight:600}
@font-face{font-family:'Readex Pro';src:url(fonts/rp5.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#F4F6F9;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#F4F6F9;font-family:'Readex Pro',sans-serif}
.el{position:absolute;left:0;top:0}
.txt{white-space:nowrap;overflow:hidden;padding:.02em .04em .06em;font-feature-settings:"kern"}
.txt .in{display:block}
.img{overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.plate{box-sizing:content-box;overflow:hidden;background:#fff;border:8px solid #fff;border-radius:18px}.plate.phone{border:12px solid #0B2545;border-radius:42px}.caption{white-space:normal;overflow:hidden}.caption .in{white-space:normal}
.plate img{position:absolute;left:0;top:0;filter:none}
.platefx{position:absolute;inset:0;background:transparent}
.grain{position:absolute;inset:0;z-index:9999;pointer-events:none;mix-blend-mode:soft-light;opacity:.35;background-size:1920px 1920px}
svg#svgdefs{position:absolute;width:0;height:0}
</style></head><body>
<svg id="svgdefs"><defs id="defs"></defs></svg>
<div id="stage"></div>
<script src="data.js"></script>
<script>
const FMT=(location.hash||'#h').slice(1); const LANG=new URLSearchParams(location.search).get('lang')||'ar'; const st=document.getElementById('stage');
if(FMT==='v'){st.style.width='1080px';st.style.height='1920px';}else{st.style.width='1920px';st.style.height='1080px';}
</script>
<script src="engine.js"></script>
<script src="compose.js"></script>
<script>document.write('<script src="spec_'+FMT+'.js"><\/script>');</script>
</body></html>
