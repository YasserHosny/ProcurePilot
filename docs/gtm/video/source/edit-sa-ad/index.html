<!doctype html><html lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Readex Pro';src:url(fonts/ReadexPro.ttf);font-weight:160 700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0B2545;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#F4F6F9;font-family:'Readex Pro',sans-serif;color:#0B2545}
.abs{position:absolute;left:0;top:0}
.scene{position:absolute;inset:0;overflow:hidden}
.kt{display:flex;flex-wrap:wrap;direction:rtl;column-gap:.26em;row-gap:0;line-height:1.18;font-weight:700}
.kt .w{display:inline-block;overflow:hidden;padding:.16em .04em .3em;margin:-.16em -.04em -.3em;white-space:nowrap}
.kt .w .i{display:inline-block;will-change:transform}
.ln{overflow:hidden;direction:rtl;white-space:nowrap;padding:.16em .04em .3em;margin:-.16em -.04em -.3em;line-height:1.18}
.ln .i{display:inline-block}
.plate{position:absolute;overflow:hidden;background:#fff;border-radius:20px;box-shadow:0 34px 90px rgba(11,37,69,.22),0 4px 14px rgba(11,37,69,.10);outline:8px solid #fff}
.plate.phone{outline:14px solid #0B2545;border-radius:38px;box-shadow:0 40px 90px rgba(11,37,69,.34)}
.plate .world{position:absolute;left:0;top:0;transform-origin:0 0}
.plate .world img,.plate .world canvas{position:absolute;left:0;top:0;display:block}
.ring{position:absolute;border:4px solid #12A594;border-radius:12px;background:rgba(18,165,148,.10)}
.chip{position:absolute;direction:rtl;white-space:nowrap;font-weight:600;border-radius:999px;padding:.42em 1em .5em;background:#0B2545;color:#fff;box-shadow:0 12px 30px rgba(11,37,69,.25)}
.chip.teal{background:#12A594}.chip.light{background:#fff;color:#0B2545}
.paper{position:absolute;background:#fff;box-shadow:0 24px 60px rgba(11,37,69,.28),0 2px 6px rgba(11,37,69,.12);overflow:hidden}
.paper img{width:100%;height:100%;object-fit:cover;display:block}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.28;background:url(build/tex/grain.png);z-index:900}
.ltr{direction:ltr;unicode-bidi:isolate}
</style></head><body>
<div id="stage"></div>
<script src="build/data.js"></script>
<script src="build/assets.js"></script>
<script src="ad.js"></script>
</body></html>
