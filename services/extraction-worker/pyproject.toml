[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "procurepilot-extraction-worker"
version = "0.1.0"
description = "ProcurePilot quotation extraction worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "redis>=5.2,<6",
    "rq>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "boto3>=1.35,<2",
    "azure-ai-documentintelligence>=1.0,<2",
    "openpyxl>=3.1,<4",
    "procurepilot-logging",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/procurepilot_extraction_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
