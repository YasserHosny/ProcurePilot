# Override: connect API + workers to REMOTE Supabase instead of the local stack.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.remote.yml up api web redis
#
# The local Supabase services (db, auth, rest, storage, kong, studio) are not needed
# and should NOT be started — the remote hosted project handles auth, storage, and DB.

services:
  api:
    depends_on:
      redis:
        condition: service_started
    environment:
      # Let .env values flow through — remove the local-stack overrides
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}

  extraction-worker:
    depends_on:
      redis:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

  optimiser:
    depends_on:
      redis:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}

  export-worker:
    depends_on:
      redis:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
