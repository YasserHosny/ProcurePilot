<div class="screenshot-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title class="dialog-caption">{{ currentItem().caption }}</h2>
    <button
      mat-icon-button
      type="button"
      class="dialog-close-btn"
      (click)="dialogRef.close()"
      [attr.aria-label]="'landing.gallery.close' | translate"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>
  <div class="dialog-body">
    <button
      mat-icon-button
      type="button"
      class="dialog-nav-btn prev-btn"
      (click)="prev()"
      [disabled]="currentIndex() === 0"
      [disabledInteractive]="true"
      [attr.aria-label]="'landing.gallery.previous' | translate"
    >
      <mat-icon aria-hidden="true">{{ isRtl() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
    <div class="dialog-image-wrapper">
      <img
        [src]="currentItem().src"
        [alt]="currentItem().alt"
        width="1440"
        height="900"
        class="dialog-image"
      />
    </div>
    <button
      mat-icon-button
      type="button"
      class="dialog-nav-btn next-btn"
      (click)="next()"
      [disabled]="currentIndex() >= items().length - 1"
      [disabledInteractive]="true"
      [attr.aria-label]="'landing.gallery.next' | translate"
    >
      <mat-icon aria-hidden="true">{{ isRtl() ? 'chevron_left' : 'chevron_right' }}</mat-icon>
    </button>
  </div>
</div>
