<div class="screenshot-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title class="dialog-caption">{{ data.caption }}</h2>
    <button
      mat-icon-button
      type="button"
      class="dialog-close-btn"
      (click)="dialogRef.close()"
      [attr.aria-label]="'landing.gallery.close' | translate"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>
  <mat-dialog-content class="dialog-body">
    <img
      [src]="data.src"
      [alt]="data.alt"
      width="1440"
      height="900"
      class="dialog-image"
    />
  </mat-dialog-content>
</div>
