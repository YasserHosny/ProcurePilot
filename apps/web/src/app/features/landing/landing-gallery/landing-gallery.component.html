<section id="gallery" class="gallery-section" aria-labelledby="gallery-heading">
  <div class="gallery-container">
    <div class="gallery-header-row">
      <div class="gallery-header-text">
        <h2 id="gallery-heading" class="section-title">
          {{ 'landing.gallery.title' | translate }}
        </h2>
        <p class="section-subtitle">
          {{ 'landing.gallery.subtitle' | translate }}
        </p>
      </div>
      <div class="gallery-controls">
        <button
          mat-icon-button
          type="button"
          class="gallery-nav-btn prev-btn"
          (click)="prevCard()"
          [disabled]="activeCardIndex() === 0"
          [attr.aria-label]="'landing.gallery.previous' | translate"
        >
          <mat-icon aria-hidden="true">{{ isRtl() ? 'arrow_forward' : 'arrow_back' }}</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          class="gallery-nav-btn next-btn"
          (click)="nextCard()"
          [disabled]="activeCardIndex() === galleryCards.length - 1"
          [attr.aria-label]="'landing.gallery.next' | translate"
        >
          <mat-icon aria-hidden="true">{{ isRtl() ? 'arrow_back' : 'arrow_forward' }}</mat-icon>
        </button>
      </div>
    </div>

    <ul
      #railEl
      class="gallery-rail"
      role="list"
      tabindex="0"
      aria-roledescription="carousel"
      [attr.aria-label]="'landing.gallery.railLabel' | translate"
      (keydown)="onRailKeydown($event)"
    >
      @for (card of galleryCards; track card.id; let i = $index) {
        <li
          #cardEl
          class="gallery-card"
          [class.active]="activeCardIndex() === i"
          role="group"
          [attr.data-index]="i"
          [attr.aria-label]="getCardAriaLabel(i, card)"
        >
          <figure class="gallery-card-figure">
            <div class="gallery-card-top-bar">
              <span class="gallery-card-numbered-label">{{ card.numberedLabelKey | translate }}</span>
            </div>
            <div class="gallery-image-wrapper">
              <img
                [src]="'/landing/' + currentLocale() + '/' + card.file"
                [alt]="('landing.gallery.altPrefix' | translate) + (card.captionKey | translate)"
                width="1440"
                height="900"
                [loading]="i < 2 ? 'eager' : 'lazy'"
                class="gallery-card-image"
              />
              <button
                mat-icon-button
                type="button"
                class="gallery-enlarge-btn"
                (click)="openEnlargeDialog(i)"
                [attr.aria-label]="'landing.gallery.enlarge' | translate"
              >
                <mat-icon aria-hidden="true">zoom_in</mat-icon>
              </button>
            </div>
            <figcaption class="gallery-card-caption">
              <p class="gallery-caption-sentence">{{ card.captionKey | translate }}</p>
              <span class="gallery-demonstration-chip">{{ 'landing.gallery.demonstrationChip' | translate }}</span>
            </figcaption>
          </figure>
        </li>
      }
    </ul>

    <nav class="gallery-step-index" [attr.aria-label]="'landing.gallery.railLabel' | translate">
      @for (card of galleryCards; track card.id; let i = $index) {
        <button
          type="button"
          #stepEl
          class="gallery-step-btn"
          [class.active]="activeCardIndex() === i"
          [attr.aria-current]="activeCardIndex() === i ? 'true' : null"
          (click)="scrollToCard(i)"
        >
          {{ card.labelKey | translate }}
        </button>
      }
    </nav>
  </div>
</section>
