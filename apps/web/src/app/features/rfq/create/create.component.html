<div class="rfq-create-container">
  <h2>Create RFQ</h2>

  <form [formGroup]="form" (ngSubmit)="onSave()">
    
    <div formArrayName="lines" class="lines-section">
      <h3>Items</h3>
      <div *ngFor="let line of linesFormArray.controls; let i=index" [formGroupName]="i" class="line-row">
        <label>
          Product ID
          <input formControlName="workspace_product_id" type="text" />
        </label>
        <label>
          Quantity
          <input formControlName="quantity" type="number" step="0.01" />
        </label>
        <button type="button" (click)="removeLine(i)" [disabled]="linesFormArray.length === 1">
          Remove
        </button>
      </div>
      <button type="button" (click)="addLine()">Add Line</button>
    </div>

    <div class="field-row">
      <label>
        Supplier IDs (comma separated or multi-select component in real app)
        <select multiple formControlName="supplierIds">
          <option value="sup-1">Supplier 1</option>
          <option value="sup-2">Supplier 2</option>
        </select>
      </label>
    </div>

    <div class="field-row">
      <label>
        Needed By Date
        <input type="date" formControlName="neededByDate" />
      </label>
    </div>

    <div class="field-row">
      <label>
        Tenant Terms
        <textarea formControlName="tenantTerms"></textarea>
      </label>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="form.invalid || isSaving() || rfqId() !== null">
        Save Draft
      </button>
    </div>
  </form>

  <div *ngIf="rejectedSuppliers().length > 0" class="rejections">
    <h4>Rejected Suppliers</h4>
    <ul>
      <li *ngFor="let rej of rejectedSuppliers()">
        Supplier ID: {{ rej.supplier_id }} - Reason: {{ rej.reason }}
      </li>
    </ul>
  </div>

  <div *ngIf="rfqId() !== null" class="send-section">
    <p>RFQ Status: {{ rfqStatus() }}</p>
    <button type="button" (click)="onSend()" [disabled]="isSending() || rfqStatus() === 'sent'">
      Send RFQ
    </button>
  </div>
</div>
