<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ProcurePilot</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Converge rounded app icon (docs/brand/logo): SVG, with PNG and ICO fallbacks copied from its PNGs. ?v=2 busts stale cached Angular icon; bump v when the icon changes. -->
  <link rel="icon" type="image/svg+xml" href="assets/brand/procurepilot-app-icon-rounded.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Readex Pro: the app font for Latin and Arabic. Noto Kufi Arabic: tabular figures only (.pp-figures). -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Material Symbols Outlined at the Ledger axes (opsz 20, wght 300, FILL 0, GRAD 0); block, so a
       ligature never flashes as its name while the font loads. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,0,0&display=block" rel="stylesheet">
</head>
