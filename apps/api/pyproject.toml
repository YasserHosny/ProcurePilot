[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "procurepilot-api"
version = "0.1.0"
description = "ProcurePilot FastAPI modular monolith backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart==0.0.31",
    "python-jose[cryptography]==3.3.0",
    # Explicit direct dependency (previously only transitive via python-jose[cryptography]):
    # Fernet encrypts accounting_connection's OAuth tokens at rest (R3.1 security review, T039,
    # see config.py's accounting_token_encryption_key). Relying on a transitive dependency for
    # security-critical code is fragile — if python-jose ever drops or re-pins it, this would
    # break silently.
    "cryptography>=44",
    "httpx==0.28.1",
    "slowapi==0.1.9",
    "supabase==2.11.0",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "rq>=2.1,<3",
    "sentry-sdk[fastapi]>=2.20,<3",
    "openpyxl>=3.1,<4",
    "reportlab>=4.2,<5",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "python-magic>=0.4.27,<0.5",
    "procurepilot-logging",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff",
]

[tool.uv.sources]
procurepilot-logging = { path = "../../packages/py-logging", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/procurepilot_api"]

[tool.hatch.build.targets.sdist]
include = [
    "src/procurepilot_api",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
