name: CI

# Every check here is required to merge. A gate nobody has watched fail is not a gate, so each job
# below has been run locally against the real stack before being wired in — see the commit that
# introduced this file.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action writes its findings back to the pull request. Without these it fails with
    # 403 'Resource not accessible by integration' — which looks like a licensing problem and is
    # not: the log says plainly that an individual account needs no licence key.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan the commits a PR adds, not just the tree.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Lint backend
        run: uv run --project apps/api ruff check apps/api
      - name: Lint web
        working-directory: apps/web
        run: pnpm lint

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector is required by migration 0001. The plain postgres image cannot apply it.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prepare the schema
        # Setting TEST_DATABASE_URL without applying the migrations was worse than not setting it:
        # the database-backed tests stop skipping and start failing on an empty schema.
        env:
          PGPASSWORD: postgres
        run: |
          # Migration 0001 enables pgcrypto (gen_random_uuid()), which the storage.objects stand-in
          # below needs as a column default. Idempotent (`if not exists`), so the full migration
          # loop re-applying it afterward is a no-op.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260819000001_extensions.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key, email text);
          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $$;
          do $$ begin create role supabase_auth_admin noinherit login password 'postgres'; exception when duplicate_object then null; end $$;
          do $$ begin create role supabase_admin superuser; exception when duplicate_object then null; end $$;
          grant usage on schema public, auth to anon, authenticated, service_role;
          grant anon, authenticated, service_role to postgres;
          -- Supabase Storage stand-in: migration 20260819000020 (chunk 4.3) seeds a bucket and
          -- adds a policy on storage.objects. Hosted Supabase and the local CLI both provide this
          -- schema already; a bare Postgres service does not.
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint
          );
          create table if not exists storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text references storage.buckets(id),
            name text,
            owner uuid
          );
          -- Real Supabase ships storage.objects with RLS already enabled and forced (see
          -- migration 20260819000020's own comment) — replicate that, or the tenant-isolation
          -- policy that migration adds never actually filters anything against this stand-in.
          alter table storage.objects enable row level security;
          alter table storage.objects force row level security;
          create or replace function storage.foldername(name text) returns text[] as $$
            select (string_to_array(name, '/'))[1 : array_length(string_to_array(name, '/'), 1) - 1];
          $$ language sql immutable;
          grant usage on schema storage to anon, authenticated, service_role;
          SQL
          for f in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Run unit and integration tests
        # TEST_DATABASE_URL is what the database-backed tests look for; without it they SKIP
        # rather than fail, so omitting it would quietly hollow out this job.
        env:
          PYTHONPATH: /tmp/procurepilot-ci-patches
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          mkdir -p /tmp/procurepilot-ci-patches
          cat > /tmp/procurepilot-ci-patches/sitecustomize.py <<'PY'
          from types import SimpleNamespace

          from procurepilot_api.shared import audit as audit_module


          class _FakePostgrest:
              def auth(self, _bearer_token):
                  return None


          class _FakeSupabaseClient:
              postgrest = _FakePostgrest()

              def rpc(self, _name, _params):
                  return self

              def execute(self):
                  return SimpleNamespace(data=[])


          def _fake_create_client(_url, _key):
              return _FakeSupabaseClient()


          audit_module.create_client = _fake_create_client
          PY
          uv run --project apps/api --with-editable services/extraction-worker pytest apps/api -q
      - name: Run product matching eval smoke gate
        # Update this to enforce precision, review-band, and ECE thresholds as soon as ml/benchmarks/product_matching/heldout.jsonl reaches 500+ records.
        run: |
          uv run --project apps/api python ml/evals/product_matching/run_eval.py > /tmp/eval_result.json
          uv run --project apps/api python -c "
          import json
          result = json.load(open('/tmp/eval_result.json'))
          assert result['gate_status'] == 'not_validated_no_held_out_benchmark', result['gate_status']
          assert 'honest_gap' in result and result['honest_gap'], 'harness must state the gap explicitly'
          "

  tenant-isolation:
    name: Tenant isolation
    # Deliberately its own job with its own name (FR-030). Constitution Principle V's failure mode
    # is silent, and a cross-tenant leak buried among two hundred other test results is a leak
    # nobody notices. When this check goes red, the reason is unambiguous.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prepare the Supabase stand-ins the migrations depend on
        # The migrations reference auth.users and grant to the Supabase roles. Hosted Supabase and
        # the local CLI both provide these; a bare Postgres service does not.
        env:
          PGPASSWORD: postgres
        run: |
          # Migration 0001 enables pgcrypto (gen_random_uuid()), which the storage.objects stand-in
          # below needs as a column default. Idempotent (`if not exists`), so the full migration
          # loop re-applying it afterward is a no-op.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260819000001_extensions.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key, email text);
          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $$;
          do $$ begin create role supabase_auth_admin noinherit login password 'postgres'; exception when duplicate_object then null; end $$;
          do $$ begin create role supabase_admin superuser; exception when duplicate_object then null; end $$;
          grant usage on schema public, auth to anon, authenticated, service_role;
          grant anon, authenticated, service_role to postgres;
          -- Supabase Storage stand-in: migration 20260819000020 (chunk 4.3) seeds a bucket and
          -- adds a policy on storage.objects. Hosted Supabase and the local CLI both provide this
          -- schema already; a bare Postgres service does not.
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint
          );
          create table if not exists storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text references storage.buckets(id),
            name text,
            owner uuid
          );
          -- Real Supabase ships storage.objects with RLS already enabled and forced (see
          -- migration 20260819000020's own comment) — replicate that, or the tenant-isolation
          -- policy that migration adds never actually filters anything against this stand-in.
          alter table storage.objects enable row level security;
          alter table storage.objects force row level security;
          create or replace function storage.foldername(name text) returns text[] as $$
            select (string_to_array(name, '/'))[1 : array_length(string_to_array(name, '/'), 1) - 1];
          $$ language sql immutable;
          grant usage on schema storage to anon, authenticated, service_role;
          SQL
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Prove cross-tenant isolation
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run --project apps/api pytest apps/api/tests/integration/test_tenant_isolation.py -q

  web-unit-tests:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Unit tests
        # Includes the i18n catalogue completeness check (SC-005): a key present in one language
        # and missing from the other fails here rather than reaching a customer as a raw key.
        working-directory: apps/web
        run: pnpm exec ng test --watch=false --browsers=ChromeHeadless
      - name: Production build
        working-directory: apps/web
        run: pnpm exec ng build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      # The quotation extraction pipeline (services/extraction-worker) is an RQ consumer over
      # Redis — nothing in this job started either, so every real quotation upload has been
      # silently unprocessable: the UI polls a job that no worker will ever pick up, and every
      # spec needing extraction to finish times out, forever, from the first such upload onward,
      # no matter how generous the wait. Nothing before this job's first real upload needed it,
      # which is why this went unnoticed.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # The post-run cache save exits 2 here and failed the whole job AFTER all 14 specs had
          # passed. A caching optimisation must never be able to fail a green test run.
          enable-cache: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        # `supabase start` — NOT docker compose. Three GoTrue versions could not migrate against a
        # hand-assembled compose stack, including the pairing Supabase themselves publish; the CLI
        # ships a set that works together. research.md R5 records the whole episode.
        # This also applies supabase/migrations and honours supabase/config.toml, which enables the
        # custom access token hook that puts tenant_id into the JWT. Without that hook every
        # tenant-scoped query returns zero rows and the app looks empty rather than broken.
        run: supabase start

      - name: Export Supabase credentials
        run: |
          supabase status -o env | sed 's/^/SUPABASE_/' > /tmp/sb.env
          {
            echo "SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_JWT_SECRET=$(supabase status -o env | grep '^JWT_SECRET=' | cut -d= -f2- | tr -d '\"')"
            echo "DATABASE_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')"
          } >> "$GITHUB_ENV"

      - name: Seed reference data
        env:
          API_HOST: 127.0.0.1
          API_PORT: '8000'
          API_ENV: local
          API_LOG_LEVEL: info
          API_CORS_ORIGINS: http://localhost:4200
          SUPABASE_JWT_AUDIENCE: authenticated
          PLATFORM_INVITATION_TTL_DAYS: '7'
          MEMBER_INVITATION_TTL_DAYS: '7'
          RATE_LIMIT_AUTH: 60/minute
          WEB_API_BASE_URL: http://localhost:8000/api/v1
          WEB_DEFAULT_LOCALE: en
        run: uv run --project apps/api python apps/api/scripts/seed.py

      - name: Start the API
        env:
          API_HOST: 127.0.0.1
          API_PORT: '8000'
          API_ENV: local
          API_LOG_LEVEL: info
          API_CORS_ORIGINS: http://localhost:4200
          SUPABASE_JWT_AUDIENCE: authenticated
          PLATFORM_INVITATION_TTL_DAYS: '7'
          MEMBER_INVITATION_TTL_DAYS: '7'
          # Higher than production on purpose: the suite signs in far more often than a person
          # does, and a 429 mid-run is a false failure. It is still a real limit, not disabled.
          RATE_LIMIT_AUTH: 60/minute
          WEB_API_BASE_URL: http://localhost:8000/api/v1
          WEB_DEFAULT_LOCALE: en
        run: |
          SUPABASE_JWT_ISSUER="${SUPABASE_URL}/auth/v1" \
            uv run --project apps/api uvicorn procurepilot_api.main:app \
            --host 127.0.0.1 --port 8000 --app-dir apps/api/src &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health

      - name: Start the extraction worker
        # Consumes the quotation-extraction RQ queue over the redis service above. Every default
        # (redis_url, queue_name, provider_mode=stub, confidence_threshold) already matches this
        # job's environment; only the Supabase connection needs to come from this job's own
        # credentials, already exported to GITHUB_ENV by "Export Supabase credentials".
        run: |
          uv run --project services/extraction-worker python -m procurepilot_extraction_worker &
          sleep 5
          pgrep -f procurepilot_extraction_worker >/dev/null || {
            echo "::error::extraction worker did not start or exited immediately"; exit 1;
          }

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Start the web app
        working-directory: apps/web
        run: |
          pnpm exec ng serve --port 4200 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4200/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:4200/ >/dev/null

      - name: Accessibility — WCAG 2.1 AA, zero violations
        # Its own step so an accessibility regression is named as one rather than buried among
        # the functional specs (FR-022, SC-006).
        working-directory: apps/web
        run: pnpm exec playwright test a11y

      - name: Run end-to-end specs
        # playwright.config.ts uses channel:'chrome' rather than a bundled browser, so CI must
        # provide Chrome. ubuntu-latest runners ship with it; this step fails loudly if that
        # ever stops being true.
        working-directory: apps/web
        run: |
          google-chrome --version
          pnpm exec playwright test

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: apps/web/test-results/
          retention-days: 7
