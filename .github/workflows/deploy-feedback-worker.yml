name: Deploy Feedback Worker

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/i18n/**'
      - 'infra/docker/feedback-worker.Dockerfile'
      - '.github/workflows/deploy-feedback-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-feedback-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, Push, and Deploy Feedback Worker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Skip docs/gtm/video (~825 MB of demo cuts no job reads): ~60 s per checkout.
          sparse-checkout: |
            /*
            !/docs/gtm/video/
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image identifiers
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/procurepilot-feedback-worker"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push feedback worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/feedback-worker.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.tag_latest }}
            ${{ steps.meta.outputs.tag_sha }}
          cache-from: type=gha,scope=feedback-worker
          cache-to: type=gha,scope=feedback-worker,mode=min

      # NOTE: this only updates an already-existing container's image, the same as
      # deploy-email-ingestion-worker.yml. It does not create the container. A
      # `procurepilot-feedback-worker` container must be created once, by hand, in the bunny.net
      # Magic Containers workers app (BUNNY_WORKERS_APP_ID), with the environment listed in
      # docs/operations/runbook.md §7.9. Until then this step fails with a "container not found"
      # style error; that is expected, not a bug in this workflow.
      - name: Update container on bunny.net Magic Containers
        uses: BunnyWay/actions/container-update-image@container-update-image_0.2.2
        with:
          api_key: ${{ secrets.BUNNY_API_KEY }}
          app_id: ${{ secrets.BUNNY_WORKERS_APP_ID }}
          container: procurepilot-feedback-worker
          image_tag: ${{ github.sha }}
