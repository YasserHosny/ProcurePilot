name: Deploy Optimiser Worker

on:
  push:
    branches:
      - main
    paths:
      - 'services/optimiser/**'
      - 'infra/docker/optimiser.Dockerfile'
      - '.github/workflows/deploy-optimiser-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-optimiser-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, Push, and Deploy Optimiser Worker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image identifiers
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/procurepilot-optimiser-worker"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push optimiser worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/optimiser.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.tag_latest }}
            ${{ steps.meta.outputs.tag_sha }}
          cache-from: type=gha,scope=optimiser
          cache-to: type=gha,scope=optimiser,mode=min

      - name: Check the container exists in the bunny.net workers app
        # The container is created once by the owner (see docs/operations/runbook.md §7.7);
        # this workflow only rolls its image. Fail with a clear message instead of a bare
        # API error when it has not been created yet.
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          APP_ID: ${{ secrets.BUNNY_WORKERS_APP_ID }}
        run: |
          code=$(curl -sS -o app.json -w '%{http_code}' \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            "https://api.bunny.net/mc/apps/${APP_ID}" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::warning::Could not list the bunny.net workers app (HTTP ${code}); skipping the existence check."
            exit 0
          fi
          if ! grep -q 'procurepilot-optimiser-worker' app.json; then
            echo "::error::Container 'procurepilot-optimiser-worker' does not exist in the bunny.net workers app. The image was pushed to GHCR, but basket splits will stay queued until the owner creates the container (docs/operations/runbook.md section 7.7)."
            exit 1
          fi

      - name: Update container on bunny.net Magic Containers
        uses: BunnyWay/actions/container-update-image@container-update-image_0.2.2
        with:
          api_key: ${{ secrets.BUNNY_API_KEY }}
          app_id: ${{ secrets.BUNNY_WORKERS_APP_ID }}
          container: procurepilot-optimiser-worker
          image_tag: ${{ github.sha }}
