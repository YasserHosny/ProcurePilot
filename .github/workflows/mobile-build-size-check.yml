name: Mobile build size check

# NOT part of ci.yml's required-to-merge set (see docs/operations/mobile-build-release-gate.md:
# cold start, the other half of the gate, cannot be automated in a headless runner). It runs on
# PRs that touch the mobile app, and on demand, so the Flutter suite and the size budget are
# visible on every mobile change.
#
# The 30MB budget is a DOWNLOAD size (specs/009-mobile-app-mvp/plan.md, roadmap §12.4). A device
# downloads one per-ABI build — from a Play app bundle or a per-ABI APK — never the "fat" APK that
# bundles the engine and app code for every CPU type (that one measured 54MB on 2026-10-17). So the
# build splits per ABI and every split APK must be under budget. Debug symbols are split out of
# the app (--split-debug-info) and kept as an artifact for symbolicating crash reports.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/i18n/**'
      - '.github/workflows/mobile-build-size-check.yml'

jobs:
  build-size:
    name: Mobile tests and release APK size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Skip docs/gtm/video (~825 MB of demo cuts no job reads): ~60 s per checkout.
          sparse-checkout: |
            /*
            !/docs/gtm/video/
          sparse-checkout-cone-mode: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        # Warnings and errors fail; infos do not. Flutter stable (after 3.47) reports every
        # `package:flutter/material.dart` import as deprecated in favour of package:material_ui —
        # a framework-wide migration tracked separately, not a defect in this app.
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: apps/mobile
        run: flutter test
      - name: Build release APKs (one per ABI)
        working-directory: apps/mobile
        run: flutter build apk --release --split-per-abi --split-debug-info=build/debug-info
      - name: Check APK size budget (30MB download, plan.md Performance Goals)
        working-directory: apps/mobile
        run: |
          budget_bytes=$((30 * 1024 * 1024))
          status=0
          found=0
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -e "$apk" ] || continue
            found=1
            actual_bytes=$(stat -c%s "$apk")
            echo "$(basename "$apk"): $actual_bytes bytes (budget: $budget_bytes bytes)"
            if [ "$actual_bytes" -gt "$budget_bytes" ]; then
              echo "::error::$(basename "$apk") ($actual_bytes bytes) exceeds the 30MB budget ($budget_bytes bytes)"
              status=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No per-ABI release APKs were built"
            exit 1
          fi
          exit "$status"
      - name: Keep debug symbols for crash symbolication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-info
          path: apps/mobile/build/debug-info
          if-no-files-found: ignore
