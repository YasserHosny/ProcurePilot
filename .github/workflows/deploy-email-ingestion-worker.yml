name: Deploy Email Ingestion Worker

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'infra/docker/email-ingestion-worker.Dockerfile'
      - '.github/workflows/deploy-email-ingestion-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-email-ingestion-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, Push, and Deploy Email Ingestion Worker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image identifiers
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/procurepilot-email-ingestion-worker"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push email ingestion worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/email-ingestion-worker.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.tag_latest }}
            ${{ steps.meta.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NOTE: this only updates an already-existing container's image, the same as
      # deploy-extraction-worker.yml. It does not create the container itself. A
      # `procurepilot-email-ingestion-worker` container must be created once, by hand, in the
      # same bunny.net Magic Containers app that already hosts `procurepilot-extraction-worker`
      # (BUNNY_WORKERS_APP_ID) -- see docs/quality/r4.3-release-evidence.md's "Live Hosted
      # Walkthrough" section for why this worker had never run in production before. This step
      # will fail with a "container not found" style error until that one-time manual step is
      # done; it is not a bug in this workflow.
      - name: Update container on bunny.net Magic Containers
        uses: BunnyWay/actions/container-update-image@container-update-image_0.2.2
        with:
          api_key: ${{ secrets.BUNNY_API_KEY }}
          app_id: ${{ secrets.BUNNY_WORKERS_APP_ID }}
          container: procurepilot-email-ingestion-worker
          image_tag: ${{ github.sha }}
