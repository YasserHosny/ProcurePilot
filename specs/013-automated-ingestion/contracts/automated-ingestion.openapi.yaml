openapi: 3.1.0
info:
  title: ProcurePilot Automated Ingestion API
  description: >
    API contract for R3.0 Automated Ingestion — email forwarding, quotation
    capture, and supplier catalogue import.
  version: 3.0.0

paths:
  /api/v1/tenants/email-config:
    get:
      operationId: getEmailConfig
      summary: Get tenant email ingestion configuration
      tags: [Ingestion]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenant email config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEmailConfig'
        '404':
          description: No email config exists for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: updateEmailConfig
      summary: Update tenant email ingestion configuration
      description: Owner only. Creates or updates the tenant's email ingestion settings.
      tags: [Ingestion]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantEmailConfigUpdate'
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEmailConfig'
        '403':
          description: Caller is not an owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/tenants/email-config/enable:
    post:
      operationId: enableEmailIngestion
      summary: Enable email ingestion for the tenant
      description: Owner only. Enables inbound email ingestion for the tenant.
      tags: [Ingestion]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Email ingestion enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEmailConfig'
        '403':
          description: Caller is not an owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/tenants/email-config/disable:
    post:
      operationId: disableEmailIngestion
      summary: Disable email ingestion for the tenant
      description: Owner only. Disables inbound email ingestion for the tenant.
      tags: [Ingestion]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Email ingestion disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEmailConfig'
        '403':
          description: Caller is not an owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/webhooks/inbound-email:
    post:
      operationId: receiveInboundEmail
      summary: Receive inbound email webhook from SES/Mailgun
      description: >
        Called by the email service provider when an email is received at a
        tenant's forwarding address. Validates the webhook signature, stores
        the raw email, and enqueues an ingestion job. Always returns HTTP 202
        Accepted for both successful ingestion and every rejection path (unknown
        recipient, disabled tenant, domain not allowlisted, daily limit reached,
        oversized) to prevent leaking tenant existence or configuration state
        (R10).
      tags: [Webhooks]
      parameters:
        - name: X-Ingestion-Webhook-Secret
          in: header
          required: false
          schema:
            type: string
          description: Interim shared secret for stub/SES webhook verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific webhook payload (SES SNS notification or Mailgun POST)
      responses:
        '202':
          description: >
            Webhook accepted for processing. Always returned for success and all
            rejection outcomes (unknown recipient, disabled tenant, domain not
            allowlisted, daily rate limit reached, oversized payload) to prevent
            leaking tenant existence or state.

  /api/v1/capture:
    post:
      operationId: captureQuotation
      summary: Upload a quotation photo or PDF via mobile capture
      description: >
        Owner or buyer. Accepts an image (JPEG, PNG, HEIC) or PDF file with
        optional supplier attribution and notes. Synchronously creates a quotation
        record with source='capture' and status='pending', stores the document,
        and queues extraction.
      tags: [Ingestion]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image (JPEG, PNG, HEIC) or PDF file. Max 10 MB.
                supplier_id:
                  type: string
                  format: uuid
                  description: Optional supplier UUID if known.
                notes:
                  type: string
                  maxLength: 1000
                  description: Optional free-text context.
      responses:
        '202':
          description: Quotation created and extraction queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureResponse'
        '403':
          description: Caller is not an owner or buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Supplier not found (or cross-tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Unsupported media type (not PDF, JPEG, PNG, or HEIC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error (file missing, empty, or exceeds 10 MB limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/suppliers/{supplier_id}/catalogue-import:
    post:
      operationId: importSupplierCatalogue
      summary: Import a supplier price catalogue from CSV or XLSX
      description: >
        Owner or buyer. Parses the uploaded CSV or XLSX file, creates a
        reviewed quotation with quotation lines for valid rows, triggers
        matching against products, and records import summary statistics.
        Runs synchronously.
      tags: [Ingestion]
      security:
        - BearerAuth: []
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or XLSX file. Max 25 MB.
      responses:
        '201':
          description: Import completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueImportResult'
        '403':
          description: Caller is not an owner or buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Supplier not found (or cross-tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid file format, oversized file, or unmappable columns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/ingestion/emails:
    get:
      operationId: listIngestionEmails
      summary: List processed inbound emails
      description: List inbound email logs for the caller's tenant, cursor-paginated and filtered.
      tags: [Ingestion]
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: status
          in: query
          schema:
            type: string
            enum: [received, processing, completed, failed, duplicate, rejected]
        - name: from_domain
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
          description: Filter emails received on or after this date (YYYY-MM-DD) or ISO datetime.
        - name: date_to
          in: query
          schema:
            type: string
          description: Filter emails received on or before this date (YYYY-MM-DD) or ISO datetime.
      responses:
        '200':
          description: Paginated list of ingestion emails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionEmailLogList'

  /api/v1/suppliers/{supplier_id}/catalogue-imports:
    get:
      operationId: listCatalogueImports
      summary: List catalogue import history for a supplier
      description: Cursor-paginated catalogue import history for a single supplier.
      tags: [Ingestion]
      security:
        - BearerAuth: []
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Paginated list of catalogue imports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueImportSummaryList'
        '404':
          description: Supplier not found (or cross-tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/ingestion/stats:
    get:
      operationId: getIngestionStats
      summary: Get ingestion dashboard statistics
      description: Ingestion dashboard stats aggregate object.
      tags: [Ingestion]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Aggregate ingestion statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionStats'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message, trace_id]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          description: Context-specific error details
        trace_id:
          type: string

    TenantEmailConfig:
      type: object
      required:
        - id
        - forwarding_address
        - enabled
        - daily_limit
        - daily_count
        - daily_count_date
        - spf_dkim_required
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        forwarding_address:
          type: string
          description: "Format: {tenant_slug}@ingest.procurepilot.com"
        enabled:
          type: boolean
        domain_allowlist:
          type: array
          items:
            type: string
          nullable: true
        daily_limit:
          type: integer
        daily_count:
          type: integer
        daily_count_date:
          type: string
          format: date
        spf_dkim_required:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantEmailConfigUpdate:
      type: object
      properties:
        enabled:
          type: boolean
          nullable: true
        domain_allowlist:
          type: array
          items:
            type: string
          nullable: true
        daily_limit:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
        spf_dkim_required:
          type: boolean
          nullable: true

    CaptureResponse:
      type: object
      required: [quotation_id, status]
      properties:
        quotation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]

    CatalogueImportResult:
      type: object
      required:
        - id
        - supplier_id
        - status
        - total_rows
        - imported_rows
        - skipped_rows
        - error_rows
        - error_details
      properties:
        id:
          type: string
          format: uuid
        supplier_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, failed]
        total_rows:
          type: integer
        imported_rows:
          type: integer
        skipped_rows:
          type: integer
        error_rows:
          type: integer
        error_details:
          type: array
          items:
            type: object
            required: [error]
            properties:
              row:
                type: integer
                nullable: true
              column:
                type: string
                nullable: true
              error:
                type: string

    IngestionEmailLog:
      type: object
      required:
        - id
        - message_id
        - from_address
        - from_domain
        - received_at
        - status
        - attachment_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
        from_address:
          type: string
        from_domain:
          type: string
        subject:
          type: string
          nullable: true
        received_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [received, processing, completed, failed, duplicate, rejected]
        error_message:
          type: string
          nullable: true
        attachment_count:
          type: integer
        quotation_id:
          type: string
          format: uuid
          nullable: true
        supplier_id:
          type: string
          format: uuid
          nullable: true
        match_method:
          type: string
          enum: [address, domain, thread, manual]
          nullable: true
        created_at:
          type: string
          format: date-time

    IngestionEmailLogList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IngestionEmailLog'
        next_cursor:
          type: string
          nullable: true

    CatalogueImportSummary:
      type: object
      required:
        - id
        - supplier_id
        - file_name
        - file_path
        - file_size_bytes
        - file_format
        - status
        - created_at
        - created_by
      properties:
        id:
          type: string
          format: uuid
        supplier_id:
          type: string
          format: uuid
        file_name:
          type: string
        file_path:
          type: string
        file_size_bytes:
          type: integer
        file_format:
          type: string
          enum: [csv, xlsx]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        total_rows:
          type: integer
          nullable: true
        imported_rows:
          type: integer
          nullable: true
        skipped_rows:
          type: integer
          nullable: true
        error_rows:
          type: integer
          nullable: true
        error_details:
          type: array
          items:
            type: object
            required: [error]
            properties:
              row:
                type: integer
                nullable: true
              column:
                type: string
                nullable: true
              error:
                type: string
        column_mapping:
          type: object
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid

    CatalogueImportSummaryList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueImportSummary'
        next_cursor:
          type: string
          nullable: true

    IngestionStats:
      type: object
      required:
        - emails_received_today
        - emails_received_week
        - emails_received_month
        - capture_uploads_total
        - catalogue_imports_total
        - supplier_match_rate
        - extraction_success_rate
      properties:
        emails_received_today:
          type: integer
        emails_received_week:
          type: integer
        emails_received_month:
          type: integer
        capture_uploads_total:
          type: integer
        catalogue_imports_total:
          type: integer
        supplier_match_rate:
          type: number
          format: float
          description: Fraction of completed emails auto-matched to a supplier (0.0 – 1.0)
        extraction_success_rate:
          type: number
          format: float
          description: Fraction of terminal extraction jobs for email/capture that succeeded (0.0 – 1.0)
