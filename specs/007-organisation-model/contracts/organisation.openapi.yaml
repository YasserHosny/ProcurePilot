openapi: 3.1.0
info:
  title: ProcurePilot Organisation Model API
  version: 0.7.0
  description: >
    Chunk R2.0 (first Phase 2 chunk). Base path /api/v1, Supabase JWT bearer auth, tenant
    resolved server-side from the token, cursor pagination capped at 100, Idempotency-Key on
    mutations, and the {code, message, details, trace_id} error envelope.

    Branches, cost centres, and budgets are the organisational structure later chunks (R2.1
    onward) assign purchase requests and approvals against. A member holding a branch-scoped
    role (branch_manager, approver) sees only their own assigned branch(es); an owner sees
    everything. A same-tenant, different-branch reference resolves as not_found, never
    forbidden, extending the existing cross-tenant convention to this new axis.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /organisation/branches:
    get:
      summary: List branches visible to the caller
      description: >
        Owner sees every branch in the tenant. A member holding a branch-scoped role sees only
        their assigned branch(es). A member holding an unscoped role (buyer, viewer, or a
        branch-scoped role with no assignment yet) sees every branch, same as owner, per
        research.md R1.
      parameters:
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Branch list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchList' }
    post:
      summary: Create a branch
      description: Owner only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchCreate' }
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /organisation/branches/{branch_id}:
    patch:
      summary: Edit or deactivate a branch
      description: >
        Owner only. Deactivating a branch with existing dependents (cost centres, branch role
        assignments) is permitted; the response names what is still attached so the caller can
        surface an explicit confirmation before committing to it in the UI.
      parameters:
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchUpdate' }
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /organisation/cost-centres:
    get:
      summary: List cost centres visible to the caller
      description: >
        Same branch-scoped visibility as /organisation/branches, evaluated against the cost
        centre's own branch_id (organisation-wide cost centres, branch_id null, are always
        visible).
      parameters:
        - name: branch_id
          in: query
          schema: { type: string, format: uuid }
        - name: is_archived
          in: query
          schema: { type: boolean }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Cost centre list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostCentreList' }
    post:
      summary: Create a cost centre
      description: Owner only. Rejects a duplicate code within the same tenant (FR-003).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CostCentreCreate' }
      responses:
        '201':
          description: Cost centre created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostCentre' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A cost centre with this code already exists in this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /organisation/cost-centres/{cost_centre_id}:
    patch:
      summary: Edit or archive a cost centre
      description: Owner only.
      parameters:
        - name: cost_centre_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CostCentreUpdate' }
      responses:
        '200':
          description: Cost centre updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostCentre' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A cost centre with this code already exists in this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /organisation/budgets:
    get:
      summary: List budgets visible to the caller
      description: Same branch-scoped visibility, evaluated against scope/branch_id/cost_centre_id.
      parameters:
        - name: scope
          in: query
          schema: { $ref: '#/components/schemas/BudgetScope' }
        - name: branch_id
          in: query
          schema: { type: string, format: uuid }
        - name: cost_centre_id
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Budget list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetList' }
    post:
      summary: Define a budget
      description: >
        Owner only. Multiple budgets may coexist for the same scope with overlapping periods
        (spec.md User Story 3, Acceptance Scenario 3); an overlap is reported in the response,
        not rejected, so the caller's UI can surface it as a warning rather than a hard error.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetCreate' }
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetCreated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Referenced branch or cost centre not found in this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /organisation/branch-role-assignments:
    post:
      summary: Assign a member's branch-scoped role to a branch
      description: >
        Owner only. member_id must currently hold branch_manager or approver as their tenant-wide
        role (chunk 4.1's role matrix, unchanged) — this endpoint adds branch scope on top of
        that role, it does not itself change what role the member holds.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchRoleAssignmentCreate' }
      responses:
        '201':
          description: Branch role assignment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchRoleAssignment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This member is already assigned to this branch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: member_id does not currently hold a branch-scopable role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /organisation/branch-role-assignments/{assignment_id}:
    delete:
      summary: Remove a member's branch assignment
      description: Owner only. Removing the last assignment for a member returns them to unscoped visibility for that role, per research.md R1.
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Assignment removed
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }

  responses:
    Forbidden:
      description: The caller's role may not perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >
        No such record in this workspace, or the record exists but belongs to a branch outside
        the caller's own branch-scoped visibility — the two cases are indistinguishable in the
        response, per FR-008.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message, trace_id]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true, nullable: true }
        trace_id: { type: string }

    Money:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { type: string, pattern: '^-?\d+(\.\d{1,4})?$', example: '5000.0000' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: 'GBP' }

    BudgetScope:
      type: string
      enum: [organisation, branch, cost_centre]

    BudgetPeriod:
      type: string
      enum: [monthly, quarterly, annual]

    Branch:
      type: object
      required: [id, name, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string, nullable: true }
        region: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BranchCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string, nullable: true }
        region: { type: string, nullable: true, description: "supported_region code" }

    BranchUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string, nullable: true }
        region: { type: string, nullable: true }
        is_active: { type: boolean }
        confirm_dependents:
          type: boolean
          description: >
            Required true when deactivating a branch that still has dependents (cost centres or
            branch role assignments); the response to a prior attempt without it lists what is
            attached (FR-009's "explicit confirmation" requirement).

    BranchList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Branch' }
        next_cursor: { type: string, nullable: true }

    CostCentre:
      type: object
      required: [id, name, code, is_orphaned, is_archived, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        budget_owner_membership_id: { type: string, format: uuid, nullable: true }
        branch_id: { type: string, format: uuid, nullable: true }
        is_orphaned: { type: boolean }
        orphan_reason:
          type: string
          nullable: true
          enum: [branch_deactivated, owner_removed]
          description: >
            Computed at read time from the linked branch's is_active / the budget owner's
            membership status — never stored. Always null when is_orphaned is false. When both
            causes are simultaneously true, branch_deactivated takes priority (FR-010).
        is_archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CostCentreCreate:
      type: object
      required: [name, code]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        budget_owner_membership_id: { type: string, format: uuid, nullable: true }
        branch_id: { type: string, format: uuid, nullable: true, description: "Omit for an organisation-wide cost centre" }

    CostCentreUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        budget_owner_membership_id: { type: string, format: uuid, nullable: true }
        branch_id: { type: string, format: uuid, nullable: true }
        is_archived: { type: boolean }

    CostCentreList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CostCentre' }
        next_cursor: { type: string, nullable: true }

    Budget:
      type: object
      required: [id, amount, period, period_start, scope, created_at]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        period_start: { type: string, format: date }
        scope: { $ref: '#/components/schemas/BudgetScope' }
        branch_id: { type: string, format: uuid, nullable: true }
        cost_centre_id: { type: string, format: uuid, nullable: true }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    BudgetCreate:
      type: object
      required: [amount, currency, period, period_start, scope]
      additionalProperties: false
      properties:
        amount: { type: string, pattern: '^\d+(\.\d{1,4})?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        period_start: { type: string, format: date }
        scope: { $ref: '#/components/schemas/BudgetScope' }
        branch_id: { type: string, format: uuid, nullable: true, description: "Required if and only if scope=branch" }
        cost_centre_id: { type: string, format: uuid, nullable: true, description: "Required if and only if scope=cost_centre" }

    BudgetCreated:
      allOf:
        - $ref: '#/components/schemas/Budget'
        - type: object
          properties:
            overlap_warning:
              type: boolean
              description: "true when another budget already covers an overlapping period for the same scope (spec.md User Story 3, Acceptance Scenario 3) — informational, not a rejection"

    BudgetList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Budget' }
        next_cursor: { type: string, nullable: true }

    BranchRoleAssignment:
      type: object
      required: [id, membership_id, branch_id, created_at]
      properties:
        id: { type: string, format: uuid }
        membership_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    BranchRoleAssignmentCreate:
      type: object
      required: [membership_id, branch_id]
      additionalProperties: false
      properties:
        membership_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
